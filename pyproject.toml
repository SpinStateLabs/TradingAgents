[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.5"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    # --- SpinTrader additions ---
    # Venues
    "ccxt>=4.4.0",            # Kraken REST/WS (also gives us a fallback venue set)
    # ib_async, not ib_insync: the original is built on a legacy TWS API
    # release and is no longer maintained. ib_async is the continuation by one
    # of its original developers, tracking supported TWS releases.
    "ib_async>=1.0.1",        # IBKR Gateway/TWS API
    "websockets>=13.0",
    "aiohttp>=3.10",
    # Storage
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=17.0",
    "polars>=1.9",
    # Quant / Markovian layer
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "hmmlearn>=0.3.2",        # baseline HMM; the GPU path lives in spintrader.quant
    "statsmodels>=0.14",      # Markov-switching regression / MS-GARCH baselines
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
tradingagents = "cli.main:app"
spintrader = "spintrader.cli:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "spintrader*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
