# IB Gateway on the GB10, native arm64, with IBC handling login and the
# mandatory daily restart.
#
# Deploy:
#   docker compose -f ops/ib-gateway-compose.yml --env-file ~/spintrader/.ibkr up -d
#
# Security posture
# ----------------
# The API port is bound to 127.0.0.1 ONLY. An IB API socket carries full
# trading rights with no per-request authentication -- anything that can open
# the port can place orders. Since the trading loop runs on this same box,
# there is no reason to expose it to the LAN, and every reason not to.
#
# To reach it from the Windows dev box, tunnel rather than rebind:
#   ssh -N -L 4002:127.0.0.1:4002 spinner@10.0.0.62

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: spintrader-ibgw
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      # paper | live -- keep this on paper until walk-forward results justify
      # otherwise. Switching it is a deliberate, visible act.
      TRADING_MODE: ${TRADING_MODE:-paper}
      # Belt and braces alongside SPINTRADER_LIVE_ENABLED: with READ_ONLY_API
      # true, the Gateway itself refuses orders regardless of what the
      # application sends. Set false only when arming live trading.
      READ_ONLY_API: ${READ_ONLY_API:-yes}
      # IBKR forces a daily restart; IBC performs it in this window (local time).
      TIME_ZONE: ${TIME_ZONE:-America/Toronto}
      # If 2FA times out, exit so Docker's restart policy retries cleanly
      # rather than leaving a half-alive Gateway that accepts no connections.
      TWOFA_TIMEOUT_ACTION: exit
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:59 PM}
      BYPASS_WARNING: yes
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # host:container -- 127.0.0.1 prefix is the security boundary.
      - "127.0.0.1:4001:4003"   # live  API
      - "127.0.0.1:4002:4004"   # paper API
      - "127.0.0.1:5900:5900"   # VNC, for the first login and 2FA prompts
    volumes:
      - ib-settings:/home/ibgateway/Jts
    healthcheck:
      # The port answering is the only meaningful liveness signal; the Java
      # process can be up while the API socket is not yet listening.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4004' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  ib-settings:
